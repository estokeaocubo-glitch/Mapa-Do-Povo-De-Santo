<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Moderação · Mapa do Povo de Santo</title>
  <meta name="theme-color" content="#12100E" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/vendor/lucide/lucide.min.js" defer></script>
  <script src="/js/admin.js" type="module"></script>
</head>
<body class="overflow-auto">
  <main class="mx-auto max-w-5xl px-4 py-8 md:py-12">
    <div class="flex flex-wrap items-center gap-3">
      <div>
        <p class="section-title">Área restrita</p>
        <h1 class="font-display text-2xl font-bold md:text-3xl">Moderação de cadastros</h1>
      </div>
      <a href="/" class="ml-auto text-sm font-semibold text-ouro hover:underline">← Voltar ao mapa</a>
    </div>

    <form id="form-token" class="glass mt-6 flex flex-col gap-3 rounded-2xl p-4 sm:flex-row sm:items-end">
      <div class="flex-1">
        <label class="label" for="token">Token de moderação</label>
        <input id="token" type="password" autocomplete="off" required class="field" placeholder="Cole o seu token de moderação" />
      </div>
      <button type="submit" class="btn-primary"><i data-lucide="log-in" class="h-4 w-4"></i>Entrar</button>
    </form>

    <section id="painel-admin" class="mt-6 hidden">
      <div class="flex flex-wrap items-center gap-2" role="group" aria-label="Filtrar por situação">
        <button type="button" class="chip" data-status="Pendente" aria-pressed="true">Pendentes</button>
        <button type="button" class="chip" data-status="Aprovado" aria-pressed="false">Aprovados</button>
        <button type="button" class="chip" data-status="Rejeitado" aria-pressed="false">Rejeitados</button>
        <button type="button" class="chip" data-status="historico" aria-pressed="false"><i data-lucide="history" class="h-3.5 w-3.5"></i>Histórico</button>
        <button type="button" id="sair" class="ml-auto text-xs font-semibold text-stone-300 hover:underline">Sair</button>
      </div>
      <p id="moderador" class="mt-4 text-xs text-stone-400"></p>
      <p id="resumo" class="mt-1 text-sm text-stone-300" aria-live="polite"></p>
      <ul id="registros" class="mt-3 space-y-3"></ul>
    </section>

    <p class="mt-8 text-xs leading-relaxed text-stone-400">
      Esta página mostra dados privados (localização real, endereço, contatos). Use apenas em dispositivo de confiança
      e não compartilhe o token. Recomenda-se proteger esta rota também com Cloudflare Access.
    </p>
  </main>
  <div id="toasts" class="pointer-events-none fixed inset-x-0 top-6 z-[1000] flex flex-col items-center gap-2 px-4" aria-live="assertive"></div>
</body>
</html>
